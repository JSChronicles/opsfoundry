[project]
site_name = "Ops Foundry"
site_url = "https://opsfoundry.dev/"
site_description = "Documentation hub for Anvil, Foundry, Forge, guides, and related templates."
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Anvil" = [
    { "Overview" = "anvil/index.md" },
    { "Execution Model" = "anvil/execution-model.md" },
    { "CLI" = "anvil/cli.md" },
    { "Task Contract" = "anvil/task-contract.md" },
    { "Configuration" = "anvil/configuration.md" },
    { "Examples" = "anvil/examples.md" },
  ] },
  { "Guides and notes" = [
    { "Overview" = "guides/index.md" },
    { "AWS" = [
      { "Overview" = "guides/aws/index.md" },
      { "Programmatic Account Access" = "guides/aws/programmatic-account-access.md" },
      { "CloudFormation Templates" = "guides/aws/cloudformation/index.md" },
      { "OIDC for GitHub Actions" = "guides/aws/oidc-github-actions.md" },
    ] },
    { "GitHub" = [
      { "Overview" = "guides/github/index.md" },
      { "Best Practices" = "guides/github/best-practices.md" },
      { "GitHub at Scale" = "guides/github/at-scale.md" },
    ] },
    { "Python Best Practices" = "guides/python-best-practices.md" },
    { "uv and pyproject.toml Best Practices" = "guides/uv-pyproject-best-practices.md" },
    { "Dependabot Best Practices" = "guides/dependabot-best-practices.md" },
    { "Dependabot Auto-Approval" = "guides/dependabot-auto-approval.md" },
  ] },
]

[project.theme]
variant = "classic"
language = "en"
features = [
  "navigation.instant",
  "navigation.tracking",
  "search.suggest",
  "search.highlight",
]

[project.theme.palette]
scheme = "slate"
primary = "black"
accent = "blue"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
