AWSTemplateFormatVersion: '2010-09-09'
Description: Creates SecurityAccessRole target role in payer/member accounts

Parameters:
  DelegatedAdminAccountId:
    Type: String
    Description: AWS Account ID of the delegated admin account
    AllowedPattern: '^\d{12}$'

  PermissionSetName:
    Type: String
    Description: Optional. Name of the IAM Identity Center permission set allowed to assume this role. Leave blank to allow any principal from the delegated admin account.
    Default: ''

  RoleName:
    Type: String
    Default: SecurityAccessRole

Conditions:
  RestrictToPermissionSet: !Not [!Equals [!Ref PermissionSetName, '']]

Resources:
  SecurityAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Security target role assumable from delegated admin account
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowDelegatedAdminSecurityRole
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${DelegatedAdminAccountId}:root
            Action: sts:AssumeRole
            Condition: !If
              - RestrictToPermissionSet
              - ArnLike:
                  aws:PrincipalArn:
                    - !Sub arn:aws:iam::${DelegatedAdminAccountId}:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_${PermissionSetName}_*
                    - !Sub arn:aws:iam::${DelegatedAdminAccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_${PermissionSetName}_*
              - !Ref AWS::NoValue
      MaxSessionDuration: 3600

Outputs:
  RoleArn:
    Description: ARN of the SecurityAccessRole
    Value: !GetAtt SecurityAccessRole.Arn