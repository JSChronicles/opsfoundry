[project]
name = "opsfoundry-dev"
version = "0.1.0"
description = "Documentation site for opsfoundry.dev."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "zensical>=0.0.41",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["N", "E4", "E7", "E9", "F"]
task-tags = ["TODO", "FIXME", "HACK"]

[tool.ruff.format]
skip-magic-trailing-comma = true
