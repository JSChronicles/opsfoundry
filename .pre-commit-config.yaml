repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 73c2d77a42a113aee9e4b748c24937f09557b82d # 0.11.24
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: c59bba8fb259db0fec2bbb77ad8ba51ea7341b56 # v0.15.20
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format