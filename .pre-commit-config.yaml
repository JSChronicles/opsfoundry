repos:
- repo: https://github.com/astral-sh/uv-pre-commit
  # uv version.
  rev: 7253e23326b03c7ce9ed90ee47ec72f8ce95741c # 0.12.4
  hooks:
    - id: uv-lock
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3 # v0.16.3
  hooks:
    # Run the linter. https://docs.astral.sh/ruff/linter/
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter. https://docs.astral.sh/ruff/formatter/
    - id: ruff-format